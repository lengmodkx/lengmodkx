name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with recent activity

    steps:
      - uses: actions/checkout@v4

      - name: Generate github activity
        run: python scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=false&hide_title=true&show_icons=true&theme=material-palenight
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=material-palenight
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}
          fail_on_error: true

      - name: Update README with recent activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "⚡ Update README with recent activity" || exit 0
          git push

      - name: Sync to Gitee
        env:
          GITEE_RSA_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITEE_RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts 2>/dev/null

          git config user.name "lengmodkx"
          git config user.email "lengmodkx@users.noreply.gitee.com"

          git remote remove gitee 2>/dev/null || true
          git remote add gitee "git@gitee.com:lengmodkx/lengmodkx.git"
          git push gitee HEAD:main --force

      - name: Verify Gitee sync
        if: always()
        run: |
          echo "✅ Gitee sync step finished. Check: https://gitee.com/lengmodkx/lengmodkx"