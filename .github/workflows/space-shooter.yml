name: Update Space Shooter Game

on:
  schedule:
    # Daily at midnight UTC, slightly offset from update-readme.yml to avoid
    # racing on the same bot commit identity.
    - cron: '15 0 * * *'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    name: Update space shooter animation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 is required by gh-space-shooter@v2 so it can
          # amend the previous commit instead of creating a new one
          # (keeps the repository history from bloating with daily bot commits).
          fetch-depth: 2

      - name: Sync local main to remote
        # The gh-space-shooter@v2 action commits and pushes internally
        # using whatever HEAD was current at checkout time. If anything
        # else (e.g. the daily update-readme.yml bot) pushes to main
        # between checkout and push, the action's push gets rejected
        # with "fetch first". Pulling + rebasing here puts the action's
        # working base on top of the latest remote main, so its push
        # always lands on the current tip.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Generate space shooter game
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          # WebP is dramatically smaller than GIF for the same animation.
          output-path: 'profile/game.webp'
          # Enemy attack pattern: column | row | random
          strategy: 'random'
          # Lower fps keeps the file size reasonable while staying smooth.
          fps: 25
          # Disable V2's amend behavior. By default the action tries to
          # amend a previous "🎮 Update space shooter game" commit, which
          # fails on the first run (no history to amend) and silently
          # prevents the file from being committed. no-amend forces a
          # brand-new commit every time, which is safer for a fresh setup.
          no-amend: 'true'
          commit-message: '🎮 Update space shooter game'
